{% extends 'base.html' %}

{% block title%}
TrekMate-Login Page
{%endblock%}
{% block navbar%}
    <a class="navbar-brand" href="#">TrekMate</a>    
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="{{url_for('index')}}">Dashboard</a>
                <a class="nav-link" href="{{url_for('register')}}">User Registeration</a>
                <a class="nav-link" href="{{url_for('register_staff')}}">Staff Registeration</a>
            </div>
        </div>
{%endblock%}

{% block content%}
<div class="container mt-5">
    
    <h2 class="text-center mb-4">Login</h2>
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <form method="POST" class="mt-5">
                    <div class="mb-4 mt-4">
                    <label for="username" class="form-label">Username:
                        <input type="text" name="username" id="username" class="form-control" required>
                    </label>
                    </div>
                    <div class="mb-4">
                    <label for="password" class="form-label">Password:
                        <input type="password"  name="password" id="password" class="form-control" required>
                    </label>
                    </div>
                    
                    <div class="mt-3 mb-5">
                        <input type="submit" value="Login" class="btn btn-success">
                    </div>
                    <p>Don't have account? <a href="{{url_for('register')}}">Register</a></p>
                    
                </form> 
            </div>   
        </div>
</div>
{%endblock%}

{% block style%}
<style>
    nav{
        width: 100%;
        padding:0px;
        margin:0px
    }
    body{
        margin:0px;
        padding:0px;
    }
    form{
        display: flex;
        justify-content: center;
        flex-direction: column;
        background-color: aliceblue;
        align-items: center;
        padding:5px;
    }
    h2{
        margin-top:64px;
        text-align: center;
    }
</style>
{% endblock%}
